name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No JavaScript under src/ (TypeScript only)
        run: |
          if find src -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \) | grep .; then
            echo '::error::App code under src/ must be .ts or .vue'; exit 1
          fi
      - run: npm ci
      - name: Typecheck (vue-tsc, required)
        run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
